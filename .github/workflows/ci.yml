name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        # Same image family as PROD (postgis + pgvector + timescale) — the
        # entitlement integration specs need a real schema, and migrations
        # need the extensions. This also makes every CI run a migration
        # rehearsal on a prod-shaped Postgres.
        image: timescale/timescaledb-ha:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crave_search_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Generate Prisma client
        working-directory: apps/api
        run: yarn prisma generate

      - name: Apply migrations to the test database
        working-directory: apps/api
        run: yarn prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/crave_search_test?schema=public

      # BEFORE type-check, deliberately. A backtick inside a SQL comment ends
      # the Prisma.sql template, and tsc then reports TS1005/TS1134 about
      # commas and variable declarations — true errors that name neither the
      # backtick nor the template. tsc CATCHES this; it cannot NAME it, and a
      # parser-based rule cannot run at all on a file that no longer parses.
      # Running first means the readable answer arrives before the cascade.
      - name: 'Static guard: no backtick inside an embedded SQL comment'
        run: node scripts/check-sql-comment-backticks.mjs

      # Two Railway manifest keys break production SILENTLY, both burned into
      # CLAUDE.md after real incidents and neither previously enforced:
      # `deploy.startCommand` overrides the Dockerfile CMD and is exec'd with
      # no shell (the container migrates, exits 0, never serves), and
      # `build.watchPatterns` makes Railway skip a deploy while reporting
      # success. Covers the repo half only — the dashboard setting merges with
      # the file, which deploy.sh's unconditional SKIPPED check owns.
      - name: 'Static guard: railway manifests carry no startCommand/watchPatterns'
        run: node scripts/check-railway-manifests.mjs

      # A README's commands are the only part of a repo that can be wrong
      # SILENTLY, because nothing runs them: README.md documented
      # `yarn workspace api db:seed` three times and that script has never
      # existed (F2500). Scoped to docs that read as CURRENT RECIPES — the
      # history corpora (plans/, audit/, product/, business/, the stale root
      # specs) are excluded in the script, each with its reason, because a
      # permanently-red gate gets disabled and that is worse than nothing.
      - name: 'Static guard: doc commands and paths resolve'
        run: node scripts/check-doc-claims.mjs

      # Migrations run in the container's BOOT command, so a heavy one that
      # exhausts prod's small /dev/shm does not fail a migration — it
      # P3009-crash-loops the deploy. AUTHORING.md §1 has required the two
      # parallel-worker SETs since F303 and nothing enforced it; the heaviest
      # rewrite in the corpus (160 columns) carries the guard zero times.
      - name: 'Static guard: a heavy migration disables parallel workers'
        run: node scripts/check-migration-parallel-guard.mjs

      # IDEAL-VERIFIED means someone read the file AND argued its shape is
      # right. When the file then changes, that claim is no longer about the
      # file that exists — and a stale IDEAL-VERIFIED is worse than an
      # unreviewed one, because it is never re-examined. The revert rule was
      # applied from memory until F2220; 759 rows had gone stale unnoticed.
      - name: 'Static guard: no COVERAGE row claims review of a file that changed'
        run: node scripts/coverage-staleness.mjs --check

      # Type check FIRST (rederivation D27): CI used to die at Lint, leaving
      # type errors — including the rotted DB-integration spec — invisible.
      # One second of tsc buys the truth about compilability. (The static
      # guards above run before it because they NAME failures tsc can only
      # detect.)
      - name: Type check
        run: yarn type-check

      - name: Lint
        run: yarn lint

      # A ban is only a ban if it survives the merge. ESLint REPLACES a rule's
      # options when a later config block sets the same rule, which silently
      # deleted two door-lock bans (F2050) while their comments still claimed
      # they were live — `yarn lint` was green throughout, because a rule that
      # does not exist reports nothing. This gate compares each override's
      # EFFECTIVE config against the baseline and fails when one has fewer
      # bans than the file next to it.
      - name: 'Static guard: no eslint override silently drops a repo-wide ban'
        run: node scripts/check-lint-ban-inheritance.mjs

      # A use- prefix is a Rules-of-Hooks claim. The F2900 census found 13
      # files in Search runtime/shared whose use- name called NO hook — pure
      # type files and plain derive/pluck functions wearing hook names (one
      # was 401 lines of types). Renamed under D70 Stage 1; this gate keeps
      # the layer from regrowing the lie. Comment-stripped matching; typeof
      # references don't count as calls; zero files scanned fails.
      - name: 'Static guard: a use-* file in Search runtime/shared calls a hook'
        run: node scripts/check-search-runtime-hook-names.mjs

      # The gate above asks whether a MODULE is reached; this one asks whether
      # a MEMBER of a stylesheet is. F5706 found three dead keys in a 932-line
      # sheet BY HAND — the sheet has sixteen importers, so it is maximally
      # alive at file granularity while carrying dead weight at key
      # granularity. First run of this gate found TWENTY more (fossil keys
      # shadowed by same-named keys on component-local sheets, which is
      # exactly why it matches `<binding>.<key>` and not the bare name, and
      # why it strips comments first — two of F5706's three survived only in
      # prose). All twenty verified by hand and deleted; it is green now.
      - name: 'Static guard: no orphan StyleSheet key under screens/Search'
        run: node scripts/check-search-styles-orphan-keys.mjs

      # And this one asks whether a declared ARGUMENT is read. TypeScript checks
      # only that an argument is SUPPLIED; eslint sees only the identifiers a
      # binding pattern NAMES — so a property present in an args TYPE but absent
      # from the destructure is checked by nothing (F4601), and a `{ ...rest }`
      # pattern hides it entirely. EARN-THEN-DRAIN-THEN-WIRE (D111, third use of
      # the pattern): the scanner was calibrated against the real F4101 family
      # restored from pre-fix blobs, ran report-only until its false positives
      # were designed out, then found ELEVEN live dead arguments — all eleven
      # verified genuine by reading, two of them already declared dead in the
      # code's own comments. --check stayed deliberately UNWIRED until F6900
      # deleted those eleven, because a gate that lands red is the thing this
      # repo keeps learning not to ship. Zero files in scope is a FAILURE.
      - name: 'Static guard: no declared-but-never-read hook argument'
        run: node scripts/find-dead-hook-args.mjs --check

      - name: Build
        run: yarn build

      - name: Test
        run: yarn test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/crave_search_test?schema=public
          REDIS_HOST: localhost
          REDIS_PORT: 6379

      # The DB-backed integration specs are IGNORED by `yarn test`
      # (testPathIgnorePatterns) and were never run in CI — the real Postgres
      # above was serving only the migration rehearsal (red-team P1). Run them.
      - name: Test (DB integration specs)
        working-directory: apps/api
        run: yarn test:db
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/crave_search_test?schema=public
          REDIS_HOST: localhost
          REDIS_PORT: 6379

      # The track sheet's HOST-WIRING falsifiers and the native engine's pure
      # falsifiers were a LOCAL RITUAL: `yarn test` runs only the default jest
      # project (pure *.spec.ts), so the render lane (built specifically to go
      # RED when host wiring is deleted) and the C suites (the domain authority
      # + engine facts, with their mutation ledgers) never ran here. A falsifier
      # nobody runs is a comment. Both lanes bite in CI now.
      - name: Test (track sheet render lane — host wiring falsifiers)
        working-directory: apps/mobile
        run: yarn test:tracksheet-render

      - name: Test (native engine pure falsifiers)
        working-directory: apps/mobile
        run: yarn test:track-domain

      # F7800 — THE HERMETIC LANE, RUN DETERMINISTICALLY IN ONE WORKER. The
      # mobile pure lane's `yarn test` (above, via turbo) runs jest in PARALLEL,
      # so a hermeticity regression — a spec whose result is a function of which
      # siblings share its worker process — passes here 5 runs in 6. That is
      # exactly how F4700/F7800 hid: a `virtual: true` mock of the REAL
      # react-native module let a transitive import load the untransformed ESM
      # file, but only when the wrong siblings co-scheduled. A single-worker
      # `--runInBand` run pins module order, so the class shows RED
      # deterministically instead of 1-in-6. If a real-module virtual mock (or
      # any other worker-order dependence) is reintroduced, this step reds where
      # the parallel run stays green.
      - name: Test (hermetic lane — deterministic single-worker order)
        working-directory: apps/mobile
        run: yarn test:inband

      # DO THE GUARDS STILL BITE? For every entry in the invariant registry,
      # apply a mutation that must break it and require the check to FAIL.
      #
      # This is the step the apparatus was missing. A census of this repo found
      # ~125 invariants, 68 code comments claiming a guard was "proven RED", and
      # ZERO scripts that could reproduce any of those proofs — while 19 separate
      # historical incidents were guards discovered not to work, 13 of them
      # source scanners defeated by a comment, a rename, or a regex that only
      # matched the already-fixed shape. Five were caught only by red-teaming a
      # guard its author had verified by hand the same day.
      #
      # It runs LAST because it mutates the working tree (restoring after each
      # step), and it must run in CI rather than on demand: four gates in this
      # repo were found wired to nothing, sitting green for months. An unrun
      # proof harness would be the fifth.
      - name: Invariants still bite (mutation proofs)
        working-directory: apps/api
        run: yarn invariants
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/crave_search_test?schema=public
          REDIS_HOST: localhost
          REDIS_PORT: 6379

  search-runtime-contract-tests:
    # Contract-check job: static validation of the search-runtime cutover
    # guards. PRUNED 2026-08-02: the perf-shortcut fixture harness steps
    # (loop-report fixture, comparator, overlap/commit-span gates) referenced
    # scripts the perf sessions deleted from the repo — the job could never
    # run (exit 127) and helped keep CI red for 100 straight runs. Only the
    # guards whose scripts still exist remain.
    name: search-runtime-contract-tests (contract-check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      # The s4/s5/s6/natural cutover guards were ALSO stale (they assert on
      # runtime files the completed cutovers deleted/renamed) — their CI steps
      # were removed 2026-08-02. CORRECTION 2026-08-03 (D37/F705): only the
      # STEPS went that day; the four SCRIPTS survived in scripts/, each still
      # exiting 1, cited only by plans/ archaeology. Their cutovers are complete
      # and CI had disowned them, so the scripts were retired 2026-08-03. The
      # root-ownership gate still validates against the live tree.
      - name: 'Contract-check: root ownership gate (enforced slice S7)'
        # S6 is NOT in enforcedSliceIds, so gating on it short-circuits to
        # pass:true regardless of code — an always-green lie (red-team P1).
        # S7 is enforced, so this check can actually fail.
        run: |
          # No argument: the rules data decides what runs (F2510). Adding a slice to
          # enforcedSliceIds is now the whole act of enforcing it.
          bash scripts/search-runtime-root-ownership-gate.sh

  no-bypass-search-runtime:
    name: no-bypass-search-runtime (static guard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      # the guard hard-refuses to run without ripgrep (a green that means
      # nothing is worse than red) — ubuntu-latest doesn't ship it
      - name: Install ripgrep
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep

      - name: 'Static guard: enforce no-bypass-search-runtime'
        run: scripts/no-bypass-search-runtime.sh

      # WIRED 2026-08-03 (D37/F702). This gate was declared in package.json and
      # run by NOTHING — 16 of its checks had rotted red where nobody could see.
      # Those 16 were positive design-shape assertions pinned to exact source
      # strings/paths that legitimately moved; they were removed (see the
      # script's header). What remains is the durable negative class — deleted
      # symbols and paths must not return — and it is now enforced here.
      - name: 'Static guard: app-route runtime delete gate'
        run: scripts/app-route-runtime-delete-gate.sh

      # WIRED 2026-08-03 (D37/F704). Also previously run by nothing, and red on
      # false positives (it banned the WORD "firstPaint", which caught the live
      # onBodyFirstPaint paint-ack producer). Narrowed to the killed symbols and
      # repointed to the durable batch-size constant; green and RED-provable.
      - name: 'Static guard: search results prepared-rows delete gate'
        run: scripts/search-results-prepared-rows-delete-gate.sh

      # WIRED 2026-08-03 (D37/F716). The api-side script-containment lockdown
      # ported to root scripts/. Every script declares what it IS and what runs
      # it, or CI fails — because "a flat bag of 57 undifferentiated files" is
      # exactly what let F702's red gate and F709's dead cluster hide.
      - name: 'Static guard: scripts/ containment lockdown'
        run: scripts/scripts-containment-gate.sh

      # WIRED 2026-08-04 (F1665). audit/COVERAGE.md held 4,318 rows for 4,297
      # distinct paths, and the duplicate rows disagreed with each other — so a
      # reader's answer depended on which row they hit and the audit's own
      # denominator was inflated. The 21 pairs are merged; this keeps path a key.
      - name: 'Static guard: audit ledger path uniqueness'
        run: scripts/audit-coverage-ledger-gate.sh

      # WIRED 2026-08-04 (F1781 aftermath). THE LEDGER MUST ANSWER "WHAT IS OWED".
      # F1010 ruled "rederive = bulk delete", F1011 and F1033(c) ruled likewise —
      # all three sat ESCALATED and were never executed, and 761 lines of dead code
      # survived TWO 'clean' passes because no grep could distinguish a closed row
      # from an open one. Statuses are now a closed vocabulary and every OPEN row
      # must name its next action. This is the gate that keeps a recorded verdict
      # from silently becoming a forgotten one.
      - name: 'Static guard: findings ledger status vocabulary'
        run: bash scripts/findings-ledger-gate.sh

      # WIRED 2026-08-03 (D37/F703 + F758). Run by nothing since its creation;
      # the day it was repaired it caught a live no-fake-estimates violation
      # (`?? 0` painting unscored restaurants as the worst map tier). The
      # non-null contract check it once carried is superseded: number|null IS
      # the law for restaurant results; optionality remains banned.
      - name: 'Static guard: crave-score cutover delete gate'
        run: scripts/crave-score-cutover-delete-gate.sh

  native-tests:
    # Pure native LOD logic (MapLodKit): screen-space visibility decision, tested
    # via `swift test` — deterministic, fast, no simulator / Mapbox / React.
    # Needs macOS because the module uses CoreGraphics/CoreLocation. The heavier
    # sim-dependent layers (perf-scenario trace contracts, visual regression)
    # stay local/opt-in gates by design — too slow/flaky for per-push CI.
    name: native-tests (MapLodKit swift test)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3

      - name: Swift unit tests (pure native LOD logic)
        run: swift test --package-path apps/mobile/ios/MapLodKit

      # WIRED 2026-08-03 (D44/F1103). apps/mobile/ios/ is committed and
      # AUTHORITATIVE; app.json's expo.ios block is fossil that only
      # `expo prebuild` reads — and prebuild would regenerate ios/ from it,
      # silently deleting ~15k lines of native code plus the entire shipped
      # permission/privacy surface. This is the tripwire. It lives in the macOS
      # job because it uses `plutil` (macOS-only) to lint the three plists,
      # which nothing else in CI parses. RED-proven both ways at authoring time
      # (a drifted app.json string; a deleted MapLodKit/Package.swift).
      - name: 'Static guard: apps/mobile/ios is authoritative (anti-prebuild)'
        run: bash scripts/mobile-native-authority-gate.sh
