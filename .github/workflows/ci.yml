name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        # Same image family as PROD (postgis + pgvector + timescale) — the
        # entitlement integration specs need a real schema, and migrations
        # need the extensions. This also makes every CI run a migration
        # rehearsal on a prod-shaped Postgres.
        image: timescale/timescaledb-ha:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crave_search_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Generate Prisma client
        working-directory: apps/api
        run: yarn prisma generate

      - name: Apply migrations to the test database
        working-directory: apps/api
        run: yarn prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/crave_search_test?schema=public

      # Type check FIRST (rederivation D27): CI used to die at Lint,
      # leaving type errors — including the rotted DB-integration spec —
      # invisible. One second of tsc buys the truth about compilability.
      - name: Type check
        run: yarn type-check

      - name: Lint
        run: yarn lint

      - name: Build
        run: yarn build

      - name: Test
        run: yarn test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/crave_search_test?schema=public
          REDIS_HOST: localhost
          REDIS_PORT: 6379

      # The DB-backed integration specs are IGNORED by `yarn test`
      # (testPathIgnorePatterns) and were never run in CI — the real Postgres
      # above was serving only the migration rehearsal (red-team P1). Run them.
      - name: Test (DB integration specs)
        working-directory: apps/api
        run: yarn test:db
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/crave_search_test?schema=public
          REDIS_HOST: localhost
          REDIS_PORT: 6379

      # DO THE GUARDS STILL BITE? For every entry in the invariant registry,
      # apply a mutation that must break it and require the check to FAIL.
      #
      # This is the step the apparatus was missing. A census of this repo found
      # ~125 invariants, 68 code comments claiming a guard was "proven RED", and
      # ZERO scripts that could reproduce any of those proofs — while 19 separate
      # historical incidents were guards discovered not to work, 13 of them
      # source scanners defeated by a comment, a rename, or a regex that only
      # matched the already-fixed shape. Five were caught only by red-teaming a
      # guard its author had verified by hand the same day.
      #
      # It runs LAST because it mutates the working tree (restoring after each
      # step), and it must run in CI rather than on demand: four gates in this
      # repo were found wired to nothing, sitting green for months. An unrun
      # proof harness would be the fifth.
      - name: Invariants still bite (mutation proofs)
        working-directory: apps/api
        run: yarn invariants
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/crave_search_test?schema=public
          REDIS_HOST: localhost
          REDIS_PORT: 6379

  search-runtime-contract-tests:
    # Contract-check job: static validation of the search-runtime cutover
    # guards. PRUNED 2026-08-02: the perf-shortcut fixture harness steps
    # (loop-report fixture, comparator, overlap/commit-span gates) referenced
    # scripts the perf sessions deleted from the repo — the job could never
    # run (exit 127) and helped keep CI red for 100 straight runs. Only the
    # guards whose scripts still exist remain.
    name: search-runtime-contract-tests (contract-check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      # The s4/s5/s6/natural cutover guards were ALSO stale (they assert on
      # runtime files the completed cutovers deleted/renamed) — their CI steps
      # were removed 2026-08-02. CORRECTION 2026-08-03 (D37/F705): only the
      # STEPS went that day; the four SCRIPTS survived in scripts/, each still
      # exiting 1, cited only by plans/ archaeology. Their cutovers are complete
      # and CI had disowned them, so the scripts were retired 2026-08-03. The
      # root-ownership gate still validates against the live tree.
      - name: 'Contract-check: root ownership gate (enforced slice S7)'
        # S6 is NOT in enforcedSliceIds, so gating on it short-circuits to
        # pass:true regardless of code — an always-green lie (red-team P1).
        # S7 is enforced, so this check can actually fail.
        run: |
          bash scripts/search-runtime-root-ownership-gate.sh S7

  no-bypass-search-runtime:
    name: no-bypass-search-runtime (static guard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      # the guard hard-refuses to run without ripgrep (a green that means
      # nothing is worse than red) — ubuntu-latest doesn't ship it
      - name: Install ripgrep
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep

      - name: 'Static guard: enforce no-bypass-search-runtime'
        run: scripts/no-bypass-search-runtime.sh

      # WIRED 2026-08-03 (D37/F702). This gate was declared in package.json and
      # run by NOTHING — 16 of its checks had rotted red where nobody could see.
      # Those 16 were positive design-shape assertions pinned to exact source
      # strings/paths that legitimately moved; they were removed (see the
      # script's header). What remains is the durable negative class — deleted
      # symbols and paths must not return — and it is now enforced here.
      - name: 'Static guard: app-route runtime delete gate'
        run: scripts/app-route-runtime-delete-gate.sh

      # WIRED 2026-08-03 (D37/F704). Also previously run by nothing, and red on
      # false positives (it banned the WORD "firstPaint", which caught the live
      # onBodyFirstPaint paint-ack producer). Narrowed to the killed symbols and
      # repointed to the durable batch-size constant; green and RED-provable.
      - name: 'Static guard: search results prepared-rows delete gate'
        run: scripts/search-results-prepared-rows-delete-gate.sh

      # WIRED 2026-08-03 (D37/F716). The api-side script-containment lockdown
      # ported to root scripts/. Every script declares what it IS and what runs
      # it, or CI fails — because "a flat bag of 57 undifferentiated files" is
      # exactly what let F702's red gate and F709's dead cluster hide.
      - name: 'Static guard: scripts/ containment lockdown'
        run: scripts/scripts-containment-gate.sh

      # WIRED 2026-08-04 (F1665). audit/COVERAGE.md held 4,318 rows for 4,297
      # distinct paths, and the duplicate rows disagreed with each other — so a
      # reader's answer depended on which row they hit and the audit's own
      # denominator was inflated. The 21 pairs are merged; this keeps path a key.
      - name: 'Static guard: audit ledger path uniqueness'
        run: scripts/audit-coverage-ledger-gate.sh

      # WIRED 2026-08-04 (F1781 aftermath). THE LEDGER MUST ANSWER "WHAT IS OWED".
      # F1010 ruled "rederive = bulk delete", F1011 and F1033(c) ruled likewise —
      # all three sat ESCALATED and were never executed, and 761 lines of dead code
      # survived TWO 'clean' passes because no grep could distinguish a closed row
      # from an open one. Statuses are now a closed vocabulary and every OPEN row
      # must name its next action. This is the gate that keeps a recorded verdict
      # from silently becoming a forgotten one.
      - name: 'Static guard: findings ledger status vocabulary'
        run: bash scripts/findings-ledger-gate.sh

      # WIRED 2026-08-03 (D37/F703 + F758). Run by nothing since its creation;
      # the day it was repaired it caught a live no-fake-estimates violation
      # (`?? 0` painting unscored restaurants as the worst map tier). The
      # non-null contract check it once carried is superseded: number|null IS
      # the law for restaurant results; optionality remains banned.
      - name: 'Static guard: crave-score cutover delete gate'
        run: scripts/crave-score-cutover-delete-gate.sh

  native-tests:
    # Pure native LOD logic (MapLodKit): screen-space visibility decision, tested
    # via `swift test` — deterministic, fast, no simulator / Mapbox / React.
    # Needs macOS because the module uses CoreGraphics/CoreLocation. The heavier
    # sim-dependent layers (perf-scenario trace contracts, visual regression)
    # stay local/opt-in gates by design — too slow/flaky for per-push CI.
    name: native-tests (MapLodKit swift test)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3

      - name: Swift unit tests (pure native LOD logic)
        run: swift test --package-path apps/mobile/ios/MapLodKit

      # WIRED 2026-08-03 (D44/F1103). apps/mobile/ios/ is committed and
      # AUTHORITATIVE; app.json's expo.ios block is fossil that only
      # `expo prebuild` reads — and prebuild would regenerate ios/ from it,
      # silently deleting ~15k lines of native code plus the entire shipped
      # permission/privacy surface. This is the tripwire. It lives in the macOS
      # job because it uses `plutil` (macOS-only) to lint the three plists,
      # which nothing else in CI parses. RED-proven both ways at authoring time
      # (a drifted app.json string; a deleted MapLodKit/Package.swift).
      - name: 'Static guard: apps/mobile/ios is authoritative (anti-prebuild)'
        run: bash scripts/mobile-native-authority-gate.sh
