pre-commit:
  parallel: true
  commands:
    # THE CONCURRENT-LANE COMMIT FENCE (F4102/D83). Opt-in per shell: a lane
    # exports LANE_PATHS (colon-separated globs) and this refuses any commit
    # whose staged set is not a subset. Unset = silent pass, humans unaffected.
    # Runs FIRST-ish (parallel, but cheap) so a sweep dies before lint spends.
    lane-pathspec:
      run: bash scripts/check-lane-pathspec.sh
    # Package-specific linting - only runs when files in that package change
    api-lint:
      glob: 'apps/api/**/*.{ts,tsx}'
      run: bash ./.lefthook/with-node-22.sh yarn --silent lint:staged:api
    mobile-lint:
      glob: 'apps/mobile/**/*.{ts,tsx,js,jsx}'
      run: bash ./.lefthook/with-node-22.sh yarn --silent lint:staged:mobile
    shared-lint:
      glob: 'packages/shared/**/*.{ts,tsx}'
      run: bash ./.lefthook/with-node-22.sh yarn --silent lint:staged:shared

    deps-check:
      glob: '{package.json,yarn.lock,apps/*/package.json,packages/*/package.json}'
      run: bash ./.lefthook/with-node-22.sh yarn --silent deps-check

    # Global formatting for all staged files
    prettier:
      glob: '*.{js,jsx,ts,tsx,json,md,yml,yaml}'
      run: bash ./.lefthook/with-node-22.sh yarn prettier --check {staged_files}

    # (F2505) A dead `root-lint` block used to sit here, disabled with the
    # comment "no root ESLint config". That premise was FALSE: `.eslintrc.js`
    # exists at the repo root and is load-bearing — apps/mobile/.eslintrc.js:2
    # is `extends: ['../../.eslintrc.js']`, and `eslint --print-config` resolves
    # it. Deleted rather than enabled: it had been commented out long enough
    # that nobody intends to turn it on, and a false reason is worse than no
    # block at all.

    secrets:
      run: gitleaks protect --staged --verbose --redact
