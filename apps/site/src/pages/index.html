<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crave — Find the best dishes near you</title>
    <meta
      name="description"
      content="Crave finds the best dishes near you — real opinions, ranked. Coming soon to the App Store."
    />
    <style>
      :root {
        color-scheme: light dark;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background: #0e0f12;
        color: #f5f5f4;
      }
      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 48px 24px;
      }
      .logo {
        font-size: 56px;
        font-weight: 800;
        letter-spacing: -0.03em;
        background: linear-gradient(135deg, #ff6b4a, #ff3d68);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        margin-bottom: 16px;
      }
      h1 {
        font-size: clamp(22px, 4vw, 32px);
        font-weight: 600;
        max-width: 560px;
        line-height: 1.3;
        margin-bottom: 14px;
      }
      p.sub {
        color: #a3a3a0;
        font-size: 17px;
        max-width: 480px;
        line-height: 1.55;
        margin-bottom: 36px;
      }
      .badge {
        display: inline-block;
        padding: 14px 28px;
        border-radius: 14px;
        border: 1px solid #3a3a38;
        color: #f5f5f4;
        text-decoration: none;
        font-size: 16px;
        font-weight: 600;
        background: #1a1b1e;
      }
      .badge span {
        color: #a3a3a0;
        font-weight: 400;
        font-size: 13px;
        display: block;
      }
      footer {
        display: flex;
        gap: 24px;
        justify-content: center;
        padding: 28px 16px 40px;
        flex-wrap: wrap;
      }
      footer a {
        color: #8a8a88;
        text-decoration: none;
        font-size: 14px;
      }
      footer a:hover {
        color: #f5f5f4;
      }
      @media (prefers-color-scheme: light) {
        body {
          background: #fafaf9;
          color: #1c1917;
        }
        .badge {
          background: #fff;
          border-color: #e7e5e4;
          color: #1c1917;
        }
        p.sub,
        .badge span {
          color: #78716c;
        }
        footer a {
          color: #a8a29e;
        }
        footer a:hover {
          color: #1c1917;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="logo">Crave</div>
      <h1>Find the best dishes near you — not just the best restaurants.</h1>
      <p class="sub">
        Crave ranks what to actually order, from real opinions. Launching first in Austin, TX.
      </p>
      <div class="badge">
        Coming soon to the App&nbsp;Store<span>Join the waitlist in the app when we launch</span>
      </div>
    </main>
    <footer>
      <a href="/privacy">Privacy Policy</a>
      <a href="/terms">Terms of Service</a>
      <a href="/support">Support</a>
    </footer>
  </body>
</html>
